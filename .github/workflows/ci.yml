name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @deshtori/shared build
      - run: pnpm --filter @deshtori/shared test
      - run: scripts/ci-run.sh pnpm --filter @deshtori/api test
      - run: pnpm --filter @deshtori/api exec prisma generate
      - run: scripts/ci-run.sh pnpm --filter @deshtori/api typecheck
      - run: scripts/ci-run.sh pnpm --filter @deshtori/web typecheck
      - run: scripts/ci-run.sh pnpm --filter @deshtori/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deshtori
          POSTGRES_PASSWORD: deshtori
          POSTGRES_DB: deshtori
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U deshtori" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://deshtori:deshtori@localhost:5432/deshtori?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
      INTEGRATIONS_ENCRYPTION_KEY: ci-only-32-character-encryption-key-for-tests
      OTP_DEV_ECHO: 'true'
      GATEWAY_MOCK: 'true'
      NODE_ENV: test
      SEED_OWNER_PHONE: '+8801938273878'
      SEED_OWNER_PASSWORD: owner12345
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @deshtori/shared build
      - run: scripts/ci-run.sh pnpm --filter @deshtori/api exec prisma db push
      - run: scripts/ci-run.sh pnpm --filter @deshtori/api prisma:seed
      - run: scripts/ci-run.sh pnpm --filter @deshtori/api build
      - name: Dashboard settings and credential protection tests
        run: node --test tests/dashboard-*.test.cjs
      - name: Start API and run smoke test
        shell: bash
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && break; sleep 1; done
          node scripts/smoke.mjs | tee smoke.log
      - name: Build web
        run: scripts/ci-run.sh pnpm --filter @deshtori/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null
          $GITHUB_WORKSPACE/scripts/ci-run.sh npm i playwright@1.48.2
          $GITHUB_WORKSPACE/scripts/ci-run.sh npx playwright install --with-deps chromium
      - name: Screenshots (390px + 1280px) and layout checks
        shell: bash
        run: |
          (cd apps/web && nohup npx next start -p 3000 > ../../web.log 2>&1 &)
          for i in $(seq 1 40); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3000 > /dev/null || { echo "::error::web did not start: $(tail -n 5 web.log | tr '\n' ' ')"; exit 1; }
          cp scripts/shots.mjs /tmp/pw/shots.mjs
          set +e; (cd /tmp/pw && node shots.mjs) 2>&1 | tee shots.log; status=${PIPESTATUS[0]}; set -e
          [ -d /tmp/pw/shots ] && mv /tmp/pw/shots ./shots
          [ $status -ne 0 ] && tail -n 15 shots.log | while read l; do echo "::error::shots: $l"; done
          exit $status
      - name: Publish screenshots to the 'shots' branch
        if: always()
        shell: bash
        run: |
          [ -d shots ] || exit 0
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout -q --orphan shots-tmp && git rm -rfq --cached . > /dev/null
          git add -f shots && git commit -qm "screenshots ${GITHUB_SHA::7}" && git push -fq origin HEAD:shots
      - if: always()
        run: |
          echo "::group::api.log"; tail -n 80 api.log || true; echo "::endgroup::"
          grep '✗' shots.log 2>/dev/null | while read l; do echo "::error::shots $l"; done || true
          [ -f shots.log ] && echo "::notice::shots: $(tail -n 1 shots.log)" || true
          grep -iE 'error|exception' api.log | head -n 8 | while read l; do echo "::error::api: $l"; done || true
          grep '✗' smoke.log | while read l; do echo "::error::$l"; done || true
          echo "::notice::smoke: $(grep -c '✓' smoke.log) passed, $(grep -c '✗' smoke.log) failed"
